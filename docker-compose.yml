services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rentals}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rentals}
      POSTGRES_DB: ${POSTGRES_DB:-rentals}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rentals} -d ${POSTGRES_DB:-rentals}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://rentals:rentals@db:5432/rentals}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      TRAVELTIME_APP_ID: ${TRAVELTIME_APP_ID:-}
      TRAVELTIME_API_KEY: ${TRAVELTIME_API_KEY:-}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      SEARCH_RESULTS_PER_QUERY: ${SEARCH_RESULTS_PER_QUERY:-20}
      SEARCH_STALE_AFTER_SECONDS: ${SEARCH_STALE_AFTER_SECONDS:-129600}
      DIRECT_VERIFY_ALLOWED_DOMAINS: ${DIRECT_VERIFY_ALLOWED_DOMAINS:-}
      CITY_CENTRE_LAT: ${CITY_CENTRE_LAT:-52.9533}
      CITY_CENTRE_LNG: ${CITY_CENTRE_LNG:--1.1500}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://rentals:rentals@db:5432/rentals}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-720}
      TRAVELTIME_APP_ID: ${TRAVELTIME_APP_ID:-}
      TRAVELTIME_API_KEY: ${TRAVELTIME_API_KEY:-}
      PERMITTED_FEED_URLS: ${PERMITTED_FEED_URLS:-}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      SEARCH_RESULTS_PER_QUERY: ${SEARCH_RESULTS_PER_QUERY:-20}
      SEARCH_STALE_AFTER_SECONDS: ${SEARCH_STALE_AFTER_SECONDS:-129600}
      DIRECT_VERIFY_ALLOWED_DOMAINS: ${DIRECT_VERIFY_ALLOWED_DOMAINS:-}
      CITY_CENTRE_LAT: ${CITY_CENTRE_LAT:-52.9533}
      CITY_CENTRE_LNG: ${CITY_CENTRE_LNG:--1.1500}
    command: python -m app.worker
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api

volumes:
  pgdata:
